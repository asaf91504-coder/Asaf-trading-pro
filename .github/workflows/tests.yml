name: Free Offline Market Tests
on:
  push:
    branches: [main]
    paths:
      - '*.mjs'
      - 'netlify/functions/*.mjs'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Node version
        run: node --version
      - name: Run purely offline tests without secrets or provider calls
        env:
          ASAF_CHAT_ENABLED: 'false'
          ASAF_MARKET_ENABLED: 'false'
        run: node --test tests/*.test.mjs
