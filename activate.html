<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>הפעלת חשבון · ASAF Trading Pro</title><link rel="stylesheet" href="/workspace.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,510px);padding:30px!important;background:var(--surface);border:1px solid var(--border);border-radius:20px}h1{font-size:28px;margin:24px 0 12px}p{color:var(--muted);line-height:1.8;font-size:14px}form{display:grid;gap:18px;margin-top:25px}label{display:grid;gap:8px;font-size:13px}input,button{width:100%;font:inherit;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:13px;background:#0c1726}button{cursor:pointer}#status{min-height:50px}#status[data-error=true]{color:#fda4af}.brand{font-size:15px}a{font-size:13px}@media(max-width:600px){main{padding:24px!important}input{font-size:16px}}</style><link rel="stylesheet" href="/accessibility.css"></head><body><nav class="skip-links" aria-label="דילוג מהיר"><a href="#mainContent">דלג לתוכן הראשי</a></nav><main id="mainContent" tabindex="-1"><a class="brand" href="/">ASAF <b>TRADING PRO</b></a><h1>החשבון שלך מתחיל כאן</h1><p>הפעלה למוזמנים בלבד. ההזמנה חד־פעמית ומותאמת לאימייל שלך. אין כאן הרשמה למנוי בתשלום.</p><form id="activationForm"><label>האימייל שהוזמן<input id="email" type="email" autocomplete="username" required maxlength="250" dir="ltr"></label><button id="checkInvite" type="button">בדוק הזמנה לפני בחירת סיסמה</button><label>סיסמה חדשה<input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><label>אימות סיסמה<input id="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><button class="primary" id="activateButton" type="submit">הפעל חשבון והיכנס</button></form><p id="status" role="status" aria-live="polite">בחר סיסמה ייחודית באורך 12 תווים לפחות. אל תשלח אותה בצ׳אט.</p><a href="/?tab=chat">כבר יש לך חשבון? עבור לכניסה ←</a><footer class="site-footer"><nav aria-label="מידע ועזרה"><button type="button" data-accessibility-open>נגישות ונוחות קריאה</button><a href="/accessibility.html">הצהרת נגישות</a><a href="/data-privacy.html">פרטיות ונתונים</a><a href="/terms.html">תנאי שימוש</a><a href="/help.html">עזרה ויצירת קשר</a></nav></footer></main><script type="module">
const $=id=>document.getElementById(id),form=$('activationForm'),status=$('status'),button=$('activateButton');
const params=new URLSearchParams(location.hash.slice(1)),cacheKey='asaf_pending_account_link';
let token=params.get('invite')||params.get('reset'),mode=params.has('reset')||params.get('mode')==='reset'?'reset':'activate',expires=0;
history.replaceState(null,'',location.pathname);
try{if(/^[a-f0-9]{64}$/.test(token||'')){expires=Date.now()+30*60*1000;sessionStorage.setItem(cacheKey,JSON.stringify({token,mode,expires}))}else{const saved=JSON.parse(sessionStorage.getItem(cacheKey)||'null');if(saved?.expires>Date.now()&&/^[a-f0-9]{64}$/.test(saved.token)&&['activate','reset'].includes(saved.mode)&&(!params.has('mode')||mode===saved.mode)){({token,mode,expires}=saved)}else sessionStorage.removeItem(cacheKey)}}catch{}
const isValid=()=>/^[a-f0-9]{64}$/.test(token||'')&&expires>Date.now();
function copy(){document.querySelector('h1').textContent=mode==='reset'?'חזרה בטוחה לחשבון שלך':'החשבון שלך מתחיל כאן';button.textContent=mode==='reset'?'שמור סיסמה חדשה והיכנס':'הפעל חשבון והיכנס'}
copy();
if(params.get('email'))$('email').value=params.get('email').slice(0,250);
$('checkInvite').addEventListener('click',async()=>{status.dataset.error='false';if(!isValid()){status.textContent='פתח מחדש את הקישור האישי מהמייל.';return}if(!$('email').reportValidity())return;$('checkInvite').disabled=true;status.textContent='בודק שהקישור מתאים לאימייל…';try{const r=await fetch('/.netlify/functions/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'check',mode,token,email:$('email').value}),signal:AbortSignal.timeout(10000)});const data=await r.json();if(!r.ok)throw Error(data.error||'לא ניתן לבדוק את ההזמנה');status.textContent='ההזמנה תקינה ומתאימה לאימייל. בחר סיסמה חדשה ואשר את הפעלת החשבון.'}catch(error){status.dataset.error='true';status.textContent=error.message}finally{$('checkInvite').disabled=false}});
if(!isValid()){form.hidden=true;status.textContent=mode==='reset'?'שחזור דורש קישור אישי חדש מבעל האתר. אין עדיין שליחת מייל אוטומטית. קישור השחזור קצר־מועד וחד־פעמי.':'נדרשת הזמנה אישית תקינה. פתח את ההזמנה שקיבלת. אם פגה, בקש הזמנה חדשה מבעל האתר.'}
else status.textContent='בחר סיסמה ייחודית באורך 12 תווים לפחות. אפשר לרענן בלשונית זו במשך 30 דקות; תוקף ההזמנה נבדק בנפרד. אל תשלח סיסמה בצ׳אט.';
form.addEventListener('submit',async event=>{event.preventDefault();const password=$('password'),confirmation=$('confirmation');status.dataset.error='false';if(!isValid()){status.textContent='פג תוקף ההפעלה בלשונית. פתח מחדש את הקישור האישי.';return}if(password.value!==confirmation.value){status.textContent='הסיסמאות אינן זהות.';status.dataset.error='true';return}button.disabled=true;status.textContent='שומר את החשבון…';try{const response=await fetch('/.netlify/functions/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:mode,token,email:$('email').value,password:password.value}),signal:AbortSignal.timeout(15000)});const data=await response.json();if(!response.ok)throw Error(data.error||'הפעולה נכשלה');token=null;try{sessionStorage.removeItem(cacheKey)}catch{}form.reset();form.hidden=true;status.textContent='החשבון מוכן. מעביר לסביבת המחקר…';location.replace('/?tab=chat')}catch(error){status.dataset.error='true';status.textContent=error.message+' אם החשבון כבר נוצר, עבור לכניסה.'}finally{password.value='';confirmation.value='';button.disabled=false}});
</script><script type="module" src="/accessibility.mjs"></script></body></html>
