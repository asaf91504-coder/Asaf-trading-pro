<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>הפעלת חשבון · ASAF Trading Pro</title><link rel="stylesheet" href="/workspace.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,510px);padding:30px!important;background:var(--surface);border:1px solid var(--border);border-radius:20px}h1{font-size:28px;margin:24px 0 12px}p{color:var(--muted);line-height:1.8;font-size:14px}form{display:grid;gap:18px;margin-top:25px}label{display:grid;gap:8px;font-size:13px}input,button{width:100%;font:inherit;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:13px;background:#0c1726}button{cursor:pointer}#status{min-height:50px}#status[data-error=true]{color:#fda4af}.brand{font-size:15px}a{font-size:13px}@media(max-width:600px){main{padding:24px!important}input{font-size:16px}}</style></head><body><main><a class="brand" href="/">ASAF <b>TRADING PRO</b></a><h1>החשבון שלך מתחיל כאן</h1><p>הפעלה למוזמנים בלבד. ההזמנה חד־פעמית ומותאמת לאימייל שלך. אין כאן הרשמה למנוי בתשלום.</p><form id="activationForm"><label>האימייל שהוזמן<input id="email" type="email" autocomplete="username" required maxlength="250" dir="ltr"></label><label>סיסמה חדשה<input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><label>אימות סיסמה<input id="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="200"></label><button class="primary" id="activateButton" type="submit">הפעל חשבון והיכנס</button></form><p id="status" role="status" aria-live="polite">בחר סיסמה ייחודית באורך 12 תווים לפחות. אל תשלח אותה בצ׳אט.</p><a href="/?tab=chat">כבר יש לך חשבון? עבור לכניסה ←</a></main><script type="module">
const form=document.getElementById('activationForm'),status=document.getElementById('status'),button=document.getElementById('activateButton');
let token=new URLSearchParams(location.hash.slice(1)).get('invite');history.replaceState(null,'',location.pathname);
if(!/^[a-f0-9]{64}$/.test(token||'')){form.hidden=true;status.textContent='נדרשת הזמנה אישית תקינה. פתח את ההזמנה שקיבלת, או היכנס לחשבון קיים.'}
form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password'),confirmation=document.getElementById('confirmation');status.dataset.error='false';if(password.value!==confirmation.value){status.textContent='הסיסמאות אינן זהות.';status.dataset.error='true';return}button.disabled=true;status.textContent='מפעיל את החשבון…';try{const response=await fetch('/.netlify/functions/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,email:document.getElementById('email').value,password:password.value}),signal:AbortSignal.timeout(15000)});const data=await response.json();if(!response.ok)throw Error(data.error||'הפעלת החשבון נכשלה');token=null;form.reset();form.hidden=true;status.textContent='החשבון הופעל בהצלחה. מעביר לסביבת המחקר…';location.replace('/?tab=chat')}catch(error){status.dataset.error='true';status.textContent=error.message+' אם החשבון כבר נוצר, עבור לכניסה.'}finally{password.value='';confirmation.value='';button.disabled=false}});
</script></body></html>
